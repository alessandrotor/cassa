name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  # Utile per ripubblicare senza dover per forza fare un commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; se ne arriva una nuova mentre la precedente
# e' in corso, vince la piu' recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # I test girano prima della build: se il calcolo del resto e' rotto,
      # meglio non pubblicare niente che pubblicare un gioco che insegna male.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
